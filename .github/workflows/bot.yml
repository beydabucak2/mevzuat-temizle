name: Gunluk Mevzuat Botu

on:
  schedule:
    - cron: '0 9 * * *' 
  workflow_dispatch:     

jobs:
  calistir:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Indir
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kutuphaneleri Yukle
        run: pip install requests beautifulsoup4

      - name: Botu Calistir
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          URL: ${{ secrets.URL }}
        run: python mevzuat.py
