name: Mevzuat Guncelleme
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamı Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Paketleri Yükle
        run: pip install requests beautifulsoup4

      - name: Scraper Kodunu Çalıştır
        env:
          URL: ${{ secrets.URL }}
        run: python mevzuat.py

      - name: Değişiklikleri Depoya Kaydet (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mevzuat.json
          git commit -m "Günlük mevzuat verisi güncellendi" || echo "Değişiklik yok"
          git push
